plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'me.modmuss50.mod-publish-plugin' version '1.1.0'
}

version = "${minecraft_version}-${mod_version}"
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = neoforge_version

    // Parchment mappings removed - MC 26.1+ is no longer obfuscated

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        serverData {
            serverData()
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        clientData {
            clientData()
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com"
    }
    maven {
        name = "Progwml6 maven"
        url = "https://dvs1.progwml6.com/files/maven/"
    }
    maven {
        name = "CurseForge"
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    // JEI
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // Jade
    compileOnly "maven.modrinth:jade:${jade_version}+neoforge"
    runtimeOnly "maven.modrinth:jade:${jade_version}+neoforge"

    // GuideME - guidebook framework
    implementation "curse.maven:guideme-1173950:7885779"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neoforge_version: neoforge_version,
            neoforge_version_range: neoforge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            name = "BreakInBlocks"
            url = version.toString().endsWith("-SNAPSHOT") ?
                "https://maven.breakinblocks.com/snapshots" :
                "https://maven.breakinblocks.com/releases"
            credentials {
                username = System.getenv("MAVEN_USER") ?: ""
                password = System.getenv("MAVEN_TOKEN") ?: ""
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:deprecation'
}

// Mod publishing to CurseForge, Modrinth, and GitHub
// Pass -PdryRun=true to test publishing without actually uploading
publishMods {
    dryRun = project.hasProperty("dryRun") && project.property("dryRun") == "true"
    file = jar.archiveFile
    def changelogFile = file("metadata/changelogs/${mod_version}.md")
    changelog = changelogFile.exists() ? changelogFile.text : "Release ${version}"
    type = STABLE
    modLoaders.add("neoforge")

    curseforge {
        projectId = "1408330"
        projectSlug = "horsepowered"
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        minecraftVersions.add(minecraft_version)
        optional("jei", "jade", "guideme")
    }

    modrinth {
        projectId = "cZml36tg"
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        minecraftVersions.add(minecraft_version)
        optional("jei", "jade", "guideme")
    }

    def githubToken = providers.environmentVariable("GITHUB_TOKEN")
    if (githubToken.isPresent()) {
        github {
            repository = "breakinblocks/HorsePowered"
            accessToken = githubToken
            commitish = "main"
        }
    }
}

// Include Maven publish when running publishMods.
// Failures (e.g. HTTP 409 if the version already exists on the Maven repo) are logged
// but do not fail the overall publishMods invocation, so CurseForge/Modrinth/GitHub
// publishing can still continue.
tasks.named('publishMods') {
    def mavenUser = providers.environmentVariable("MAVEN_USER")
    if (mavenUser.isPresent()) {
        dependsOn 'publishMavenJavaPublicationToBreakInBlocksRepository'
    }
}

afterEvaluate {
    def mavenTask = tasks.findByName('publishMavenJavaPublicationToBreakInBlocksRepository')
    if (mavenTask != null) {
        def originalActions = new ArrayList<>(mavenTask.actions)
        mavenTask.actions.clear()
        mavenTask.doLast('Tolerant Maven publish') {
            originalActions.each { action ->
                try {
                    action.execute(mavenTask)
                } catch (Exception e) {
                    logger.warn("Maven publish failed (continuing anyway): ${e.message}")
                }
            }
        }
    }
}
